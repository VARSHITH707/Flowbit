<svg xmlns="http://www.w3.org/2000/svg" width="460" height="110" viewBox="0 0 460 110" role="img" aria-label="The Flowbit mascot: dim and still when not recording; bright orange with moving sound waves while recording">
  <style>.c{fill:#52514e}@media (prefers-color-scheme:dark){.c{fill:#c3c2b7}}</style>
  <defs>
    <g id="body">
      <rect x="26.8" y="43" width="2.4" height="7" fill="#3a3a3a"/>
      <rect x="19" y="49.5" width="18" height="3.6" rx="1.8" fill="#3a3a3a"/>
    </g>
  </defs>
  <!-- idle: dim, still -->
  <g transform="translate(40 8) scale(1.3)" opacity="0.85">
    <use href="#body"/>
    <rect x="10" y="4" width="36" height="40" rx="17" fill="#171717" stroke="#2e2e2e" stroke-width="1.4"/>
    <g stroke="#303030" stroke-width="1.3" stroke-linecap="round"><line x1="23" y1="10" x2="33" y2="10"/><line x1="21" y1="13.2" x2="35" y2="13.2"/><line x1="23" y1="16.4" x2="33" y2="16.4"/></g>
    <ellipse cx="17.5" cy="31.5" rx="2.4" ry="1.6" fill="#FF7900" opacity="0.28"/><ellipse cx="38.5" cy="31.5" rx="2.4" ry="1.6" fill="#FF7900" opacity="0.28"/>
    <rect x="19.7" y="20.75" width="4.6" height="6.5" rx="2.3" fill="#d9d9d9"/><rect x="31.7" y="20.75" width="4.6" height="6.5" rx="2.3" fill="#d9d9d9"/>
    <path d="M24 33 Q28 35.6 32 33" fill="none" stroke="#bdbdbd" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <text class="c" x="77" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">not recording</text>
  <!-- recording: bright, waves pulse -->
  <g transform="translate(200 8) scale(1.3)">
    <circle cx="28" cy="24" r="27" fill="#FF7900" opacity="0.18"><animate attributeName="opacity" values="0.12;0.32;0.18;0.28;0.12" dur="0.9s" repeatCount="indefinite"/></circle>
    <g fill="none" stroke="#FF7900" stroke-width="2.2" stroke-linecap="round">
      <path d="M50 14 A24 24 0 0 1 50 34"><animate attributeName="opacity" values="0.3;1;0.5;0.9;0.3" dur="0.9s" repeatCount="indefinite"/></path>
      <path d="M6 14 A24 24 0 0 0 6 34"><animate attributeName="opacity" values="0.3;1;0.5;0.9;0.3" dur="0.9s" repeatCount="indefinite"/></path>
      <path d="M55 10 A29 29 0 0 1 55 38"><animate attributeName="opacity" values="0.1;0.6;0.2;0.7;0.1" dur="0.9s" repeatCount="indefinite"/></path>
      <path d="M1 10 A29 29 0 0 0 1 38"><animate attributeName="opacity" values="0.1;0.6;0.2;0.7;0.1" dur="0.9s" repeatCount="indefinite"/></path>
    </g>
    <use href="#body"/>
    <rect x="10" y="4" width="36" height="40" rx="17" fill="#171717" stroke="#FF7900" stroke-width="2.2"/>
    <g stroke="#FF7900" stroke-width="1.3" stroke-linecap="round"><line x1="23" y1="10" x2="33" y2="10"/><line x1="21" y1="13.2" x2="35" y2="13.2"/><line x1="23" y1="16.4" x2="33" y2="16.4"/></g>
    <ellipse cx="17.5" cy="31.5" rx="2.4" ry="1.6" fill="#FF7900" opacity="0.6"/><ellipse cx="38.5" cy="31.5" rx="2.4" ry="1.6" fill="#FF7900" opacity="0.6"/>
    <rect x="19.7" y="20.25" width="4.6" height="7.5" rx="2.3" fill="#F5F5F5"/><rect x="31.7" y="20.25" width="4.6" height="7.5" rx="2.3" fill="#F5F5F5"/>
    <rect x="25.2" y="32" width="5.6" height="4" rx="2.6" fill="#FF7900"><animate attributeName="height" values="2;6;3;5.5;2" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="33;31;32.5;31.25;33" dur="0.9s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="290" y="34" width="164" height="28" rx="14" fill="#0B0B0B" stroke="#FF7900"/>
  <text x="304" y="53" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#F5F5F5">Listening 0:03 · on this PC</text>
  <text class="c" x="300" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">recording: the waves follow your voice</text>
</svg>
