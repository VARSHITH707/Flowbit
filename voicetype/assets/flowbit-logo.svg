<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Flowbit mascot: a friendly ghost-shaped robot">
  <title>Flowbit logo</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="0.6" stop-color="#121212"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB24D"/>
      <stop offset="0.55" stop-color="#FF7900"/>
      <stop offset="1" stop-color="#E24A00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ghost body: dome head, straight sides, three rounded scallops at the bottom -->
  <path id="ghost" d="M70 250 C70 120 150 50 256 50 C362 50 442 120 442 250 L442 380 Q380 485 318 410 Q256 485 194 410 Q132 485 70 380 Z"
        fill="url(#body)" stroke="url(#rim)" stroke-width="10" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- headphones: headband and two ear cups -->
  <path d="M96 232 C96 100 160 74 256 74 C352 74 416 100 416 232" fill="none" stroke="#1a1a1a" stroke-width="18" stroke-linecap="round"/>
  <path d="M96 232 C96 100 160 74 256 74 C352 74 416 100 416 232" fill="none" stroke="url(#rim)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <rect x="62" y="196" width="46" height="92" rx="22" fill="#101010" stroke="url(#rim)" stroke-width="6"/>
  <rect x="404" y="196" width="46" height="92" rx="22" fill="#101010" stroke="url(#rim)" stroke-width="6"/>
  <!-- sound-wave detail on the left ear cup -->
  <g stroke="#FF7900" stroke-width="5" stroke-linecap="round">
    <line x1="75" y1="232" x2="75" y2="250"/>
    <line x1="85" y1="222" x2="85" y2="260"/>
    <line x1="95" y1="232" x2="95" y2="250"/>
  </g>

  <!-- visor and face -->
  <rect x="150" y="150" width="212" height="160" rx="70" fill="#0c0c0c" stroke="url(#rim)" stroke-width="6" filter="url(#glow)"/>
  <path d="M184 236 Q214 200 244 236" fill="none" stroke="#FFB24D" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M268 236 Q298 200 328 236" fill="none" stroke="#FFB24D" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M226 270 Q256 300 286 270" fill="none" stroke="#FF9A2E" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="190" cy="268" rx="9" ry="5" fill="#FF7900" opacity="0.55"/>
  <ellipse cx="322" cy="268" rx="9" ry="5" fill="#FF7900" opacity="0.55"/>
</svg>
